<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Multiplayer party game hub for friends.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ember Party Club">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Ember Party Club</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --ember-bg: #120a08;
      --ember-bg-strong: #2b140f;
      --ember-gold: #f0c56a;
      --ember-cream: #fff4e7;
      --ember-mint: rgba(95, 215, 196, 0.3);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(181, 73, 34, 0.24), transparent 34%),
        linear-gradient(180deg, #3b1c14 0%, var(--ember-bg) 58%, #0d0706 100%);
    }

    body {
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
    }

    .launch-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: transparent;
      transition: opacity 240ms ease, visibility 240ms ease;
      z-index: 9999;
    }

    .launch-shell.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .launch-card {
      position: relative;
      width: min(76vw, 520px);
      padding: 40px 28px 28px;
      border: 1px solid rgba(240, 197, 106, 0.16);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(59, 28, 20, 0.92), rgba(18, 10, 8, 0.96)),
        rgba(18, 10, 8, 0.94);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 244, 231, 0.08);
      text-align: center;
    }

    .launch-card::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 20px;
      border: 1px solid rgba(240, 197, 106, 0.08);
      pointer-events: none;
    }

    .launch-wordmark {
      display: block;
      width: min(100%, 420px);
      margin: 0 auto 18px;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.32));
    }

    .launch-caption {
      margin: 0;
      color: rgba(255, 244, 231, 0.72);
      letter-spacing: 0.18em;
      font-size: 12px;
      text-transform: uppercase;
    }

    .launch-progress {
      width: min(100%, 280px);
      height: 4px;
      margin: 22px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 244, 231, 0.08);
      box-shadow: inset 0 0 0 1px rgba(240, 197, 106, 0.08);
    }

    .launch-progress::before {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--ember-gold), #fff0bf, rgba(95, 215, 196, 0.92));
      box-shadow: 0 0 22px var(--ember-mint);
      animation: ember-slide 1.1s ease-in-out infinite;
    }

    @keyframes ember-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(310%); }
    }
  </style>
</head>
<body>
  <div class="launch-shell" id="launch-shell" aria-label="Ember Party Club launch screen">
    <div class="launch-card">
      <img class="launch-wordmark" src="branding/ember_wordmark.png" alt="Ember Party Club">
      <p class="launch-caption">Private Room Club Experience</p>
      <div class="launch-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("launch-shell");
      if (splash) {
        splash.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
